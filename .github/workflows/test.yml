# 能陪专用 CI：测试按 3 片并行（2026-11-19）。
# 与 data / photo / watch 的「单 job 全量」契约不同——那边测试少，没必要拆。
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  TZ: Asia/Shanghai
  PYTHONHASHSEED: "0"

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Version sync
        run: python tools/check_version.py
      - name: Quality gate (fast)
        run: python tools/quality_gate.py --fast

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Tests (shard ${{ matrix.shard }}/3)
        run: |
          coverage run --rcfile=.coveragerc -m pytest tests -q -p no:cacheprovider \
            --splits 3 --group ${{ matrix.shard }}
          cp .coverage ".coverage.shard${{ matrix.shard }}"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage.shard${{ matrix.shard }}
          if-no-files-found: error

  coverage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install coverage
        run: pip install -r requirements-dev.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: coverage-shard-*
          merge-multiple: true
      - name: Combine and check floor
        run: |
          coverage combine
          coverage report --rcfile=.coveragerc
