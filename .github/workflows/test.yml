name: tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Version
        run: python tools/check_version.py
      - name: Type check
        run: python tools/mypy_check.py
      - name: Type check (strict)
        run: |
          MYPYPATH=.. python -m mypy --config-file mypy.ini --explicit-package-bases \
            --check-untyped-defs --exclude "(/tests/|/tools/|/__pycache__/)" .
      - name: Quality gate
        run: python tools/quality_gate.py --fast
      - name: Run tests
        run: python -m unittest discover -s tests -t tests
