[mypy]
# Every module supports two import styles: package-relative (from .x import y) and
# plain (from x import y), wired with try/except ImportError. mypy treats both
# branches as duplicate definitions (no-redef); that is intentional compatibility
# code, not a bug, so only this error code is disabled here.
disable_error_code = no-redef
python_version = 3.12
# The plugin dir is a package (it has __init__.py). Run `python tools/mypy_check.py`,
# which puts the parent dir on MYPYPATH and checks the directory as a package, so
# relative imports resolve. Do not run `mypy .` by hand.
explicit_package_bases = True
ignore_missing_imports = True
# Scope is all modules first; annotations are added incrementally. Annotated code
# is still checked.
allow_untyped_defs = True
allow_untyped_calls = True
warn_unused_ignores = True
# NOTE: keep this file ASCII-only -- mypy reads it with the locale codec (GBK here).
exclude = (?x)(
    ^tests/
    | ^tools/
    | ^\.test-tmp/
    | ^pytest-cache-files
    )
